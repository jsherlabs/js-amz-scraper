name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  javascript-tests:
    name: JavaScript Tests & Linting
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install chromium --with-deps

    - name: Run Prettier check
      run: npm run format:check

    - name: Run ESLint
      run: npm run lint

    - name: Run tests with coverage
      run: npm test

    - name: Upload coverage to Codecov
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info
        flags: javascript
        name: javascript-coverage
        fail_ci_if_error: false

  python-tests:
    name: Python Tests & Linting
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        playwright install chromium --with-deps

    - name: Run Black check
      run: black --check src/scrapers test/

    - name: Run Pylint
      run: pylint src/scrapers/*.py || true

    - name: Run pytest with coverage
      run: pytest test/ -v --cov=src/scrapers --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: python
        name: python-coverage
        fail_ci_if_error: false

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: [javascript-tests, python-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run quality checks
      run: npm run quality

    - name: All checks passed
      run: echo "✅ All quality checks passed!"
